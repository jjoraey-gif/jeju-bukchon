<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>예약 관리 · 제주 북촌 독채</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f2ec;--surface:#fff;--ink:#26302e;--muted:#6b7672;--line:#e3ddd2;--sea:#2f6f73;--sea-soft:#e3efee;--blocked:#d9534f;--blocked-soft:#fbe4e3;--sel:#c9774a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
  header h1{font-size:19px;margin:0}
  header a,header button{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:none}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
  .hidden{display:none!important}

  /* login */
  #login{max-width:380px;margin:12vh auto 0}
  #login h2{margin:0 0 4px;font-size:20px}
  #login p{margin:0 0 18px;color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px}
  .btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
  .btn-main{background:var(--sea);color:#fff;width:100%;margin-top:18px}
  .err{color:var(--blocked);font-size:14px;margin-top:10px;min-height:1em}

  /* controls */
  .tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
  .tabs button{flex:1;border:0;background:none;font:inherit;font-size:15px;padding:10px;border-radius:9px;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:var(--sea);color:#fff;font-weight:500}
  .mode{display:flex;gap:8px;margin-bottom:12px}
  .mode button{flex:1;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;padding:9px;border-radius:10px;cursor:pointer;color:var(--muted)}
  .mode button.on{border-color:var(--ink);color:var(--ink);font-weight:500}
  .hint{font-size:13.5px;color:var(--muted);margin:0 0 12px}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cal-nav button{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
  .cal-nav strong{font-size:17px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
  .dow{font-size:12px;color:var(--muted);padding:6px 0}
  .dow.sun{color:var(--blocked)}
  .day{height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;background:var(--sea-soft);color:var(--sea);cursor:pointer;user-select:none;position:relative;border:2px solid transparent}
  .day small{font-size:10px;font-weight:400;line-height:1}
  .day.empty{background:none;cursor:default}
  .day.past{background:none;color:#c9c3b9;cursor:default;font-weight:400}
  .day.blocked{background:var(--blocked-soft);color:var(--blocked)}
  .day.today{border-color:var(--ink)}
  .day.sel{background:var(--sel);color:#fff}
  .day.saving{opacity:.45}
  .legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--muted);margin-top:12px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .range-bar{position:sticky;bottom:12px;margin-top:14px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .range-bar span{flex:1 1 100%;font-size:14px}
  .range-bar .btn{flex:1;padding:10px}
  .b-block{background:var(--blocked);color:#fff}
  .b-open{background:#fff;color:var(--sea)}
  .b-cancel{background:transparent;color:#ccc;flex:0 0 auto!important}

  .summary{margin-top:14px}
  .summary h3{font-size:15px;margin:0 0 8px}
  .summary ul{list-style:none;margin:0;padding:0}
  .summary li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
  .summary li button{font:inherit;font-size:13px;color:var(--sea);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
  .summary .none{color:var(--muted);font-size:14px}

  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .setup{max-width:520px;margin:10vh auto 0;font-size:15px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <div id="setup" class="card setup hidden">
    <h2 style="margin-top:0">설정이 필요해요</h2>
    <p><code>config.js</code> 파일에 Supabase URL과 anon 키를 넣어주세요.</p>
  </div>

  <form id="login" class="card hidden">
    <h2>예약 관리</h2>
    <p>관리자 계정으로 로그인하세요.</p>
    <label for="email">이메일</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-main" type="submit">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>

  <main id="app" class="hidden">
    <header>
      <h1>예약 관리 <small id="who" style="font-size:12px;color:var(--muted);font-weight:400"></small></h1>
      <div style="display:flex;gap:14px">
        <a href="/" target="_blank">홈페이지 보기</a>
        <button id="logout">로그아웃</button>
      </div>
    </header>

    <div class="tabs">
      <button data-house="sarang" class="on">북촌사랑각</button>
      <button data-house="bookstore">북촌책방</button>
    </div>

    <div class="mode">
      <button data-mode="day" class="on">하루씩 바꾸기</button>
      <button data-mode="range">기간으로 바꾸기</button>
    </div>
    <p class="hint" id="hint"></p>

    <div class="card">
      <div class="cal-nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <strong id="title"></strong>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="grid7" id="grid"></div>
      <div class="legend">
        <span><i style="background:var(--sea-soft)"></i>예약 가능</span>
        <span><i style="background:var(--blocked-soft)"></i>예약 불가</span>
        <span><i style="background:var(--sel)"></i>선택</span>
      </div>
    </div>

    <div class="range-bar hidden" id="rangeBar">
      <span id="rangeText"></span>
      <button class="btn b-block" id="doBlock">예약 불가로</button>
      <button class="btn b-open" id="doOpen">예약 가능으로</button>
      <button class="btn b-cancel" id="doCancel">취소</button>
    </div>

    <div class="card hidden" id="errBox" style="margin-top:14px;border-color:var(--blocked);color:var(--blocked);font-size:14px;line-height:1.6"></div>

    <div class="card summary">
      <h3 id="sumTitle">예약 불가 기간</h3>
      <ul id="sumList"></ul>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const C=window.SUPABASE_CONFIG||{};
  const $=id=>document.getElementById(id);
  if(!C.url||!C.anonKey){ $('setup').classList.remove('hidden'); return; }
  const sb=supabase.createClient(C.url,C.anonKey);
  const TABLE='bukchon_blocked_dates';
  const NAMES={sarang:'북촌사랑각',bookstore:'북촌책방'};
  const DOW=['일','월','화','수','목','금','토'];
  const pad=n=>String(n).padStart(2,'0');
  const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse=s=>new Date(s+'T00:00:00');
  const fmt=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;};
  const today=new Date(); today.setHours(0,0,0,0);
  const todayKey=key(today);

  let house='sarang', mode='day', offset=0, rangeStart=null, rangeEnd=null;
  const blocked={sarang:new Set(),bookstore:new Set()};
  const saving=new Set();

  function showError(e){
    const box=$('errBox'); box.classList.remove('hidden');
    let why='';
    if(e.code==='42501') why='권한이 없어요. 로그인한 이메일이 관리자 이메일(SQL에 넣은 이메일)과 같은지 확인해 주세요.';
    else if(e.code==='23505') why='이미 예약 불가로 저장된 날짜가 섞여 있어요. 새로고침 후 다시 시도해 주세요.';
    box.innerHTML=`<b>저장 실패</b><br>${why}<br><small>코드: ${e.code||'-'} / ${e.message||''}</small>`;
  }
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);}

  /* ---------- auth ---------- */
  async function boot(){
    const {data:{session}}=await sb.auth.getSession();
    if(session){ showApp(); } else { $('login').classList.remove('hidden'); }
  }
  $('login').addEventListener('submit',async e=>{
    e.preventDefault(); $('loginErr').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});
    if(error){ $('loginErr').textContent='이메일 또는 비밀번호가 맞지 않아요.'; return; }
    $('login').classList.add('hidden'); showApp();
  });
  $('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};

  async function showApp(){
    $('app').classList.remove('hidden');
    const {data:{user}}=await sb.auth.getUser(); if(user) $('who').textContent=user.email;
    await load(); render();
  }

  /* ---------- data ---------- */
  async function load(){
    const from=new Date(today); from.setMonth(from.getMonth()-1);
    const {data,error}=await sb.from(TABLE).select('house,day').gte('day',key(from)).limit(10000);
    if(error){ toast('불러오기 실패: '+error.message); return; }
    blocked.sarang.clear(); blocked.bookstore.clear();
    data.forEach(r=>blocked[r.house]?.add(r.day));
  }
  async function setDays(days,makeBlocked){
    days=days.filter(d=>d>=todayKey && blocked[house].has(d)!==makeBlocked);
    if(!days.length) return;
    days.forEach(d=>saving.add(d)); render();
    let error;
    if(makeBlocked){
      ({error}=await sb.from(TABLE).insert(days.map(day=>({house,day}))));
    }else{
      ({error}=await sb.from(TABLE).delete().eq('house',house).in('day',days));
    }
    days.forEach(d=>saving.delete(d));
    if(error){ console.error(error); showError(error); }
    else{
      days.forEach(d=>makeBlocked?blocked[house].add(d):blocked[house].delete(d));
      toast(`${days.length}일 → ${makeBlocked?'예약 불가':'예약 가능'} 저장됨`);
    }
    render();
  }

  /* ---------- UI ---------- */
  function daysBetween(a,b){ if(a>b)[a,b]=[b,a]; const out=[],d=parse(a),e=parse(b); while(d<=e){out.push(key(d));d.setDate(d.getDate()+1);} return out; }

  function onDay(k){
    if(k<todayKey||saving.has(k)) return;
    if(mode==='day'){ setDays([k],!blocked[house].has(k)); return; }
    if(!rangeStart||rangeEnd){ rangeStart=k; rangeEnd=null; }
    else { rangeEnd=k; }
    render();
  }
  function clearRange(){rangeStart=rangeEnd=null;render();}

  function render(){
    const base=new Date(today.getFullYear(),today.getMonth()+offset,1);
    const y=base.getFullYear(), m=base.getMonth();
    $('title').textContent=`${y}년 ${m+1}월`;
    $('prev').disabled=offset<=0;
    const g=$('grid'); g.innerHTML='';
    DOW.forEach((d,i)=>{const s=document.createElement('div');s.className='dow'+(i===0?' sun':'');s.textContent=d;g.appendChild(s);});
    const first=base.getDay(), n=new Date(y,m+1,0).getDate();
    for(let i=0;i<first;i++){const s=document.createElement('div');s.className='day empty';g.appendChild(s);}
    const sel=rangeStart?new Set(daysBetween(rangeStart,rangeEnd||rangeStart)):new Set();
    for(let d=1;d<=n;d++){
      const k=`${y}-${pad(m+1)}-${pad(d)}`, el=document.createElement('div');
      el.className='day'; el.innerHTML=`${d}`;
      if(k<todayKey) el.classList.add('past');
      else{
        const isB=blocked[house].has(k);
        if(isB){el.classList.add('blocked');el.innerHTML+=`<small>불가</small>`;}
        if(sel.has(k)) el.classList.add('sel');
        if(saving.has(k)) el.classList.add('saving');
      }
      if(k===todayKey) el.classList.add('today');
      el.onclick=()=>onDay(k);
      g.appendChild(el);
    }
    // hint & range bar
    $('hint').textContent= mode==='day'
      ? '날짜를 누를 때마다 예약 가능 ↔ 불가가 바로 저장됩니다.'
      : '시작일과 마지막 날을 차례로 누른 뒤, 아래에서 적용할 상태를 고르세요. (마지막 날 = 마지막 숙박일, 퇴실일 전날)';
    const bar=$('rangeBar');
    if(mode==='range'&&rangeStart){
      bar.classList.remove('hidden');
      const [a,b]=rangeEnd?(rangeStart<=rangeEnd?[rangeStart,rangeEnd]:[rangeEnd,rangeStart]):[rangeStart,null];
      $('rangeText').textContent= b ? `${fmt(a)} ~ ${fmt(b)} · ${daysBetween(a,b).length}일 선택됨` : `${fmt(a)} 선택됨 · 마지막 날을 눌러주세요 (하루만이면 바로 적용)`;
    } else bar.classList.add('hidden');
    renderSummary();
  }

  function renderSummary(){
    $('sumTitle').textContent=`${NAMES[house]} · 예약 불가 기간`;
    const days=[...blocked[house]].filter(d=>d>=todayKey).sort();
    const ranges=[];
    days.forEach(d=>{
      const last=ranges[ranges.length-1];
      if(last){const nx=parse(last[1]);nx.setDate(nx.getDate()+1); if(key(nx)===d){last[1]=d;return;}}
      ranges.push([d,d]);
    });
    const ul=$('sumList'); ul.innerHTML='';
    if(!ranges.length){ul.innerHTML='<li class="none">앞으로 예약 불가로 막힌 날이 없어요.</li>';return;}
    ranges.forEach(([a,b])=>{
      const li=document.createElement('li');
      const out=parse(b); out.setDate(out.getDate()+1);
      const nights=daysBetween(a,b).length;
      li.innerHTML=`<span>${fmt(a)} ~ ${fmt(b)} <small style="color:var(--muted)">(${nights}박 · ${fmt(key(out))} 퇴실)</small></span>`;
      const btn=document.createElement('button'); btn.textContent='해제';
      btn.onclick=()=>{ if(confirm(`${fmt(a)} ~ ${fmt(b)} 기간을 예약 가능으로 바꿀까요?`)) setDays(daysBetween(a,b),false); };
      li.appendChild(btn); ul.appendChild(li);
    });
  }

  $('prev').onclick=()=>{if(offset>0){offset--;render();}};
  $('next').onclick=()=>{offset++;render();};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    house=b.dataset.house; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); rangeStart=rangeEnd=null; render();
  });
  document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode; document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===b)); rangeStart=rangeEnd=null; render();
  });
  $('doBlock').onclick=async()=>{const d=daysBetween(rangeStart,rangeEnd||rangeStart);rangeStart=rangeEnd=null;await setDays(d,true);};
  $('doOpen').onclick=async()=>{const d=daysBetween(rangeStart,rangeEnd||rangeStart);rangeStart=rangeEnd=null;await setDays(d,false);};
  $('doCancel').onclick=clearRange;

  boot();
})();
</script>
</body>
</html>
